# Builds the solution and runs the tests on every push to main and on pull requests.
# Pushes to main that pass are then deployed to Azure App Service.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # -warnaserror keeps the zero-warnings rule: any warning fails the build.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish
        run: dotnet publish src/Calgary311.Web --no-build --configuration Release --output publish

      # Hands the published app to the deploy job.
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: publish

  deploy:
    needs: build
    # Only for pushes to main, and only once the AZURE_WEBAPP_NAME repository variable is set up.
    if: github.event_name == 'push' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
